[package]
name = "auto-typer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clipboard-win = "=5.4.3"
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts"] }
encoding_rs = "=0.8.35"
enigo = { version = "=0.6.1", default-features = false }
html5ever = "=0.40.1"
rand = "=0.10.4"
raw-window-handle = "=0.6.2"
roxmltree = "=0.21.2"
rwml = { version = "=0.1.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "=9.7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
winresource = "=0.1.31"
